<!doctype html>
<html><head><meta charset="utf-8"><title>Radius</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#0a0a0a;color:#f5e6c8;font-family:'Barlow Condensed',sans-serif;}
.wrap{padding:18px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;justify-items:center;}
.box{width:100%;aspect-ratio:1;background:#e85d1a;display:flex;align-items:flex-end;justify-content:center;padding:8px;color:#0a0a0a;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;}
.lbl{margin-top:6px;font-size:11px;color:#c8b896;text-align:center;text-transform:uppercase;letter-spacing:0.1em;font-weight:600;}
.cell{display:flex;flex-direction:column;align-items:center;width:100%;}
</style></head><body><div class="wrap">
<div class="cell"><div class="box" style="border-radius:0">0px</div><div class="lbl">banners · rules</div></div>
<div class="cell"><div class="box" style="border-radius:4px">4px</div><div class="lbl">buttons</div></div>
<div class="cell"><div class="box" style="border-radius:8px">8px</div><div class="lbl">cards</div></div>
<div class="cell"><div class="box" style="border-radius:16px">16px</div><div class="lbl">feature</div></div>
<div class="cell"><div class="box" style="border-radius:999px;aspect-ratio:2/1;width:auto;padding:6px 14px">pill</div><div class="lbl">tags only</div></div>
</div></body></html>
