<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Core</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#1a1a1a;font-family:'Barlow Condensed',sans-serif;color:#f5e6c8;}
.wrap{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.sw{display:flex;flex-direction:column;justify-content:flex-end;height:120px;border-radius:8px;padding:12px;border:1px solid rgba(245,230,200,0.12);}
.sw .name{font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.1em;}
.sw .hex{font-size:12px;opacity:0.7;font-family:'JetBrains Mono',monospace;}
</style>
</head><body><div class="wrap">
<div class="sw" style="background:#0a0a0a"><div class="name" style="color:#f5e6c8">Black Canvas</div><div class="hex" style="color:#c8b896">#0a0a0a</div></div>
<div class="sw" style="background:#f5e6c8"><div class="name" style="color:#0a0a0a">Warm Cream</div><div class="hex" style="color:#3a342a">#f5e6c8</div></div>
</div></body></html>
