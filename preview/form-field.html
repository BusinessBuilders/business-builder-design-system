<!doctype html>
<html><head><meta charset="utf-8"><title>Form field</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#0a0a0a;color:#f5e6c8;font-family:'Barlow Condensed',sans-serif;}
.wrap{padding:24px;display:grid;gap:16px;max-width:480px;}
label{font-size:11px;text-transform:uppercase;letter-spacing:0.14em;color:#c8b896;font-weight:600;display:block;margin-bottom:6px;}
input,textarea{width:100%;background:#14110d;border:2px solid rgba(245,230,200,0.18);border-radius:4px;padding:12px 14px;color:#f5e6c8;font-family:'Barlow Condensed';font-size:16px;outline:none;box-sizing:border-box;}
input:focus{border-color:#e85d1a;}
.help{font-size:13px;color:#7a6f5a;margin-top:6px;}
</style></head><body><div class="wrap">
<div><label>Your shop's name</label><input value="Marlow & Sons Plumbing"><div class="help">Shows up everywhere — site, invoices, business cards.</div></div>
<div><label>Email</label><input value="ben@marlowsons.com" style="border-color:#e85d1a"></div>
</div></body></html>
