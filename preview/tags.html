<!doctype html>
<html><head><meta charset="utf-8"><title>Tags</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#0a0a0a;font-family:'Barlow Condensed',sans-serif;}
.wrap{padding:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.lbl{width:100%;font-size:10px;color:#7a6f5a;text-transform:uppercase;letter-spacing:0.14em;font-weight:600;margin-top:6px;}
.script{font-family:'Lobster Two';font-style:italic;font-weight:700;color:#e85d1a;font-size:22px;transform:rotate(-6deg);display:inline-block;}
</style></head><body><div class="wrap">
<span class="bb-tag">Most Popular</span>
<span class="bb-tag bb-tag-teal">New</span>
<span class="bb-tag bb-tag-gold">Pro</span>
<span class="bb-tag bb-tag-ghost">Soon</span>
<span class="script">most popular!</span>
<div class="lbl">Pill tags + script "sticker" flourish (rotate -6°)</div>
</div></body></html>
