<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#0a0a0a;font-family:'Barlow Condensed',sans-serif;color:#f5e6c8;}
.wrap{padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.sw{height:140px;border-radius:8px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;}
.role{font-size:11px;text-transform:uppercase;letter-spacing:0.14em;opacity:0.85;font-weight:700;}
.name{font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:0.05em;}
.hex{font-size:12px;opacity:0.85;font-family:'JetBrains Mono',monospace;}
</style></head><body><div class="wrap">
<div class="sw" style="background:#e85d1a;color:#0a0a0a"><div class="role">Primary</div><div><div class="name">Sign Orange</div><div class="hex">#e85d1a</div></div></div>
<div class="sw" style="background:#2a7fa8;color:#fbf1d8"><div class="role">Secondary</div><div><div class="name">Diner Teal</div><div class="hex">#2a7fa8</div></div></div>
<div class="sw" style="background:#c23b22;color:#fbf1d8"><div class="role">Tertiary</div><div><div class="name">Brick Red</div><div class="hex">#c23b22</div></div></div>
<div class="sw" style="background:#d4a847;color:#0a0a0a"><div class="role">Premium</div><div><div class="name">Sign Gold</div><div class="hex">#d4a847</div></div></div>
</div></body></html>
