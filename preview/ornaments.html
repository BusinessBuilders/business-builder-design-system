<!doctype html>
<html><head><meta charset="utf-8"><title>Ornaments</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#0a0a0a;color:#f5e6c8;font-family:'Barlow Condensed',sans-serif;}
.wrap{padding:22px 26px;display:grid;gap:16px;}
.row{display:flex;align-items:center;gap:16px;font-size:24px;color:#e85d1a;}
.lbl{font-size:10px;color:#7a6f5a;text-transform:uppercase;letter-spacing:0.14em;font-weight:600;width:170px;}
.rule-double{flex:1;border-top:3px double #f5e6c8;opacity:0.55;}
.rule-slash{flex:1;color:#e85d1a;font-weight:800;letter-spacing:0.2em;font-size:18px;}
</style></head><body><div class="wrap">
<div class="row"><span class="lbl">Star · eyebrow</span>✦</div>
<div class="row"><span class="lbl">Rosette · section</span>✺</div>
<div class="row"><span class="lbl">Lozenge · feature</span>❖</div>
<div class="row"><span class="lbl">Diamond · bullet</span>◆</div>
<div class="row"><span class="lbl">Double rule</span><span class="rule-double"></span></div>
<div class="row"><span class="lbl">Slash divider</span><span class="rule-slash">/// /// /// ///</span></div>
</div></body></html>
