<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#0a0a0a;color:#f5e6c8;font-family:'Barlow Condensed',sans-serif;}
.wrap{padding:30px 24px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-items:center;}
.cell{text-align:center;}
.card{background:#1c1812;border-radius:8px;padding:24px;color:#f5e6c8;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;font-size:13px;}
.lbl{font-size:10px;color:#7a6f5a;margin-top:14px;text-transform:uppercase;letter-spacing:0.12em;font-weight:600;}
.letter{font-family:'Lobster Two';font-style:italic;font-weight:700;font-size:42px;color:#fbf1d8;text-shadow:2px 4px 0 #c23b22, 4px 8px 0 #2a7fa8;}
</style></head><body><div class="wrap">
<div class="cell"><div class="letter">Letter</div><div class="lbl">letter shadow · brick + teal</div></div>
<div class="cell"><div class="card" style="box-shadow:0 8px 24px rgba(0,0,0,0.45);">Soft Card</div><div class="lbl">card lift · soft</div></div>
<div class="cell"><div class="card" style="box-shadow:0 0 0 2px #e85d1a, 0 16px 0 -6px #c23b22, 0 32px 64px rgba(0,0,0,0.7);">Featured</div><div class="lbl">featured · ring + drop</div></div>
</div></body></html>
