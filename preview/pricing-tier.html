<!doctype html>
<html><head><meta charset="utf-8"><title>Pricing tier</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#0a0a0a;color:#f5e6c8;font-family:'Barlow Condensed',sans-serif;}
.wrap{padding:30px 24px;display:flex;justify-content:center;}
.card{background:#1c1812;border-radius:12px;padding:24px;width:300px;position:relative;box-shadow:0 0 0 2px #e85d1a, 0 14px 0 -6px #c23b22, 0 28px 56px rgba(0,0,0,0.7);}
.eyebrow{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.16em;color:#e85d1a;margin-bottom:8px;}
.name{font-family:'Lobster Two';font-style:italic;font-weight:700;font-size:42px;color:#fbf1d8;text-shadow:2px 3px 0 #c23b22, 4px 6px 0 #2a7fa8;line-height:1;margin-bottom:12px;}
.price{font-family:'Bowlby One SC';font-size:48px;color:#fbf1d8;line-height:1;}
.per{color:#7a6f5a;font-size:13px;text-transform:uppercase;letter-spacing:0.12em;margin-left:6px;}
.sticker{position:absolute;top:-14px;right:-10px;background:#d4a847;color:#0a0a0a;font-family:'Lobster Two';font-style:italic;font-weight:700;font-size:18px;padding:6px 12px;border-radius:4px;transform:rotate(6deg);box-shadow:0 4px 0 #9a2d18;}
</style></head><body><div class="wrap">
<div class="card">
<span class="sticker">most popular!</span>
<div class="eyebrow">Plan Two ✦ Builder</div>
<div class="name">The Builder</div>
<div><span class="price">$2,400</span><span class="per">one-time</span></div>
</div></div></body></html>
