<!doctype html>
<html><head><meta charset="utf-8"><title>Cream tints</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#0a0a0a;font-family:'Barlow Condensed',sans-serif;}
.wrap{padding:18px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.sw{height:120px;border-radius:8px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(245,230,200,0.1);}
.name{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.1em;}
.hex{font-size:11px;font-family:'JetBrains Mono',monospace;}
.role{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;opacity:0.75;font-weight:700;}
</style></head><body><div class="wrap">
<div class="sw" style="background:#fbf1d8;color:#0a0a0a"><div class="role">Highlight</div><div><div class="name">Cream Bright</div><div class="hex">#fbf1d8</div></div></div>
<div class="sw" style="background:#f5e6c8;color:#0a0a0a"><div class="role">Primary text</div><div><div class="name">Cream</div><div class="hex">#f5e6c8</div></div></div>
<div class="sw" style="background:#c8b896;color:#0a0a0a"><div class="role">Secondary</div><div><div class="name">Taupe</div><div class="hex">#c8b896</div></div></div>
<div class="sw" style="background:#7a6f5a;color:#fbf1d8"><div class="role">Muted</div><div><div class="name">Dust</div><div class="hex">#7a6f5a</div></div></div>
<div class="sw" style="background:#3a342a;color:#f5e6c8"><div class="role">Disabled</div><div><div class="name">Umber</div><div class="hex">#3a342a</div></div></div>
</div></body></html>
