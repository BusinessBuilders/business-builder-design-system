<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#0a0a0a;color:#f5e6c8;font-family:'Barlow Condensed',sans-serif;}
.wrap{padding:18px 22px;}
.row{display:flex;align-items:center;gap:14px;margin-bottom:8px;font-size:13px;}
.label{width:60px;color:#c8b896;font-weight:700;font-family:'JetBrains Mono',monospace;font-size:12px;}
.bar{height:14px;background:#e85d1a;border-radius:2px;}
.token{color:#7a6f5a;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;}
</style></head><body><div class="wrap">
<div class="row"><span class="label">4px</span><span class="bar" style="width:4px"></span><span class="token">space-1</span></div>
<div class="row"><span class="label">8px</span><span class="bar" style="width:8px"></span><span class="token">space-2</span></div>
<div class="row"><span class="label">12px</span><span class="bar" style="width:12px"></span><span class="token">space-3</span></div>
<div class="row"><span class="label">16px</span><span class="bar" style="width:16px"></span><span class="token">space-4</span></div>
<div class="row"><span class="label">24px</span><span class="bar" style="width:24px"></span><span class="token">space-5</span></div>
<div class="row"><span class="label">32px</span><span class="bar" style="width:32px"></span><span class="token">space-6</span></div>
<div class="row"><span class="label">48px</span><span class="bar" style="width:48px"></span><span class="token">space-7</span></div>
<div class="row"><span class="label">64px</span><span class="bar" style="width:64px"></span><span class="token">space-8</span></div>
<div class="row"><span class="label">96px</span><span class="bar" style="width:96px"></span><span class="token">space-9 · section rhythm</span></div>
<div class="row"><span class="label">128px</span><span class="bar" style="width:128px"></span><span class="token">space-10 · hero</span></div>
</div></body></html>
